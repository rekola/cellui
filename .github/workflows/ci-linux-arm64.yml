name: Linux ARM64

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libutf8proc-dev \
            libcairo2-dev libfontconfig1-dev libgtk-4-dev xvfb xdotool

      - name: Configure
        # utf8proc here, libunistring on x86-64: both Unicode backends are tested.
        run: cmake -B build -DCELLUI_UNICODE=utf8proc

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Gallery
        run: ./build/cellui_gallery --plain | head -5
